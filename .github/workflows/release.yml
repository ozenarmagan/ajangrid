name: Kurulum dosyalarını üret

# main'e her push'ta package.json'daki sürüm (vX.Y.Z) için kurulum dosyaları
# üretilir ve aynı adlı GitHub sürümüne eklenir (yoksa oluşturulur).
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
            files: |
              dist/*.dmg
          - os: windows-latest
            script: build:win
            files: |
              dist/*-setup.exe
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }} -- --publish never
      - name: Artifact olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: ajangrid-${{ matrix.os }}
          path: ${{ matrix.files }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: AjanGrid ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body: |
            macOS Apple Silicon → `-arm64.dmg`, macOS Intel → `-x64.dmg`, Windows → `-setup.exe`.
            İmzasız sürüm: macOS'ta açılmazsa `xattr -cr /Applications/AjanGrid.app`, Windows'ta "Ek bilgi → Yine de çalıştır".
