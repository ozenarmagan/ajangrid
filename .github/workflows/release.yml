name: Kurulum dosyalarını üret

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
            files: |
              dist/*.dmg
          - os: windows-latest
            script: build:win
            files: |
              dist/*-setup.exe
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }} -- --publish never
      - name: Sürüme ekle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          draft: false
          prerelease: false
      - name: Artifact olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: ajangrid-${{ matrix.os }}
          path: ${{ matrix.files }}
